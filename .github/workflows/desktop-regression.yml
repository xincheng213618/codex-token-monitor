name: desktop regression

on:
  pull_request:
    paths:
      - "src/CodexTokenMonitor.Core/**"
      - "src/CodexTokenMonitor.Wpf/**"
      - "tests/**"
      - "Scripts/**"
      - ".github/workflows/desktop-regression.yml"
  # The weekly schedule also catches regressions that accumulate outside PRs.
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: WPF regression suite
        type: choice
        default: all
        options:
          - all
          - main
          - settings
          - analysis

concurrency:
  group: desktop-regression
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build and run isolated WPF regression
        shell: pwsh
        env:
          DESKTOP_SUITE: ${{ inputs.suite }}
        run: |
          $selectedSuite = if ([string]::IsNullOrWhiteSpace($env:DESKTOP_SUITE)) { 'all' } else { $env:DESKTOP_SUITE }
          if ($selectedSuite -eq 'all') {
            .\Scripts\Test-Desktop.ps1
          } else {
            .\Scripts\Test-Desktop.ps1 -Suite $selectedSuite
          }
      - name: Core regression
        shell: pwsh
        run: dotnet test .\tests\CodexTokenMonitor.Core.Tests\CodexTokenMonitor.Core.Tests.csproj -c Release --no-build --no-restore
      - name: Runner and CLI self-checks
        shell: pwsh
        run: .\Scripts\Test-DesktopRunner.ps1 -IncludeProbeCli
      - name: Upload desktop reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-regression
          path: artifacts/desktop-probes/
          if-no-files-found: warn
