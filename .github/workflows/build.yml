name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\CodexTokenMonitor.slnx

      - name: Build
        run: dotnet build .\CodexTokenMonitor.slnx -c Release --no-restore

      - name: Test
        run: dotnet test .\tests\CodexTokenMonitor.Core.Tests\CodexTokenMonitor.Core.Tests.csproj -c Release --no-build --no-restore

      - name: Publish self-contained smoke test
        run: |
          dotnet publish .\src\CodexTokenMonitor.Wpf\CodexTokenMonitor.Wpf.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\artifacts\publish
          if (-not (Test-Path .\artifacts\publish\CodexTokenMonitor.exe)) { throw 'Self-contained executable was not generated.' }
          $files = Get-ChildItem .\artifacts\publish -File
          if ($files.Count -ne 1) { throw "Expected one published file, found $($files.Count)." }
